function cleanUrl(v){
 v=String(v||"").trim();

 var md=v.match(/\((https?:\/\/[^)]+)\)/);
 if(md){
  v=md[1];
 }

 v=v
  .replace(/\\&/g,"&")

  .replace(/^<|>$/g,"");

 try{

   "utm_medium",
   "utm_campaign",
   "utm_term",
   "utm_content"
  ].forEach(function(k){
   u.searchParams.delete(k);

function firstMatch(text,re){
 var m=String(text||"").match(re);
 return m ? String(m[1]||"").trim() : "";
}

function sectionBetween(text,startLabel,endLabel){
 var s=String(text||"");
 var a=s.indexOf(startLabel);
 if(a<0)return "";
 a+=startLabel.length;
 var b=endLabel ? s.indexOf(endLabel,a) : -1;
 return (b<0?s.slice(a):s.slice(a,b)).trim();
}

function parseSourceResearch(raw){
 var txt=String(raw||"");
 var blocks=txt.split(/(?=\[자료\s*\d+\])/);
 var out=[];

 for(var i=0;i<blocks.length;i++){
  var b=blocks[i];
  if(!/\[자료\s*\d+\]/.test(b))continue;

  var o=firstMatch(b,/기관명:\s*([^\n\r]+)/);
  var t=firstMatch(b,/자료의 정확한 제목:\s*([^\n\r]+)/);
  var date=firstMatch(b,/발행일 또는 수정일:\s*([^\n\r]+)/);
  var u=firstMatch(b,/원문 URL_RAW:\s*(?:\r?\n\s*)?(https?:\/\/[^\s<>\]]+)/);
  if(!u){
   u=firstMatch(b,/(https?:\/\/[^\s<>\]]+)/);
  }
  u=cleanUrl(u);

  var why=firstMatch(b,/내 주제에 적합한 이유:\s*([^\n\r]+)/);
  var direct=firstMatch(b,/이 질문에 직접 답하는 본문이 실제로 있는가:\s*([^\n\r]+)/);

  var usage=sectionBetween(
   b,
   "[원문에서 확인되는 이용·적용 정보]",
   "[추가 확인]"
  );

  var missing=firstMatch(b,/자료에서 직접 확인하기 어려운 내용:\s*([^\n\r]+)/);

  if(o && t && u && direct.indexOf("답하지 않음")<0){
   out.push({
    o:o,t:t,date:date,u:u,why:why,usage:usage,missing:missing,
    use:out.length<2,
    checks:[false,false,false,false,false]
   });
  }
 }

 return out.slice(0,3);
}

function applyParsedSources(){
 var parsed=parseSourceResearch(S.sourceResearch);
 if(!parsed.length)return 0;

 var next=[blankSource(),blankSource(),blankSource()];

 for(var i=0;i<parsed.length;i++){
  var old=S.src[i]||blankSource();
  var same=cleanUrl(old.u)===cleanUrl(parsed[i].u);

  next[i]=parsed[i];

  if(same && Array.isArray(old.checks)){
   next[i].checks=old.checks.slice(0,5);
   while(next[i].checks.length<5)next[i].checks.push(false);
   next[i].use=!!old.use;
  }
 }

 S.src=next;
 return parsed.length;
}

function normalizeAiText(raw){
 return String(raw||"")
  .replace(/\r\n?/g,"\n")
  .replace(/\*\*/g,"")
  .replace(/[ \t]+\n/g,"\n")
  .trim();
}

function extractBetweenLabels(text,startPatterns,endPatterns){
 var s=String(text||"");
 var starts=Array.isArray(startPatterns)?startPatterns:[startPatterns];
 var ends=Array.isArray(endPatterns)?endPatterns:[endPatterns];

 var startIndex=-1;
 var startLen=0;

 for(var i=0;i<starts.length;i++){
  var re=new RegExp(starts[i],"i");
  var m=re.exec(s);
  if(m && (startIndex<0 || m.index<startIndex)){
   startIndex=m.index;
   startLen=m[0].length;
  }
 }

 if(startIndex<0)return "";

 var from=startIndex+startLen;
 var rest=s.slice(from);
 var endIndex=-1;

 for(var j=0;j<ends.length;j++){
  var ere=new RegExp(ends[j],"i");
  var em=ere.exec(rest);
  if(em && (endIndex<0 || em.index<endIndex)){
   endIndex=em.index;
  }
 }

 return (endIndex<0?rest:rest.slice(0,endIndex)).trim();
}

 );

 out.condition=extractBetweenLabels(

 out.other=extractBetweenLabels(

 );

 if(!out.target && !out.condition && !out.other){

 );

function parseVerifyResult(raw){
 var txt=normalizeAiText(raw);
 var countMatch=txt.match(/검증 가능한 주장 수\s*:\s*([0-4])/i);
 var stated=countMatch ? parseInt(countMatch[1],10) : null;
 var details=[];

 var re=/\[주장\s*(\d+)\]([\s\S]*?)(?=\[주장\s*\d+\]|$)/gi;
 var m;

 while((m=re.exec(txt))!==null && details.length<4){
  details.push(parseClaimBlock(m[0]));
 }

 var count;

 if(stated===0){
  count=0;
 }else if(stated!==null){
  count=stated;
 }else{
  count=details.length;
 }

 count=Math.min(4,Math.max(0,count));

 while(details.length<count){
  details.push(blankClaimDetail());
 }

 S.claimCount=String(count);
 S.claimDetails=[
  blankClaimDetail(),
  blankClaimDetail(),
  blankClaimDetail(),
  blankClaimDetail()
 ];

 for(var j=0;j<count;j++){
  S.claimDetails[j]=details[j]||blankClaimDetail();
 }

 for(var k=count;k<4;k++){
  S.claims[k]=blankClaim();
 }

 return count;
}

function parseCardResult(raw){
 var txt=String(raw||"");
 var first=sectionBetween(txt,"[1부]","[2부]");
 if(!first){
  first=txt.split(/\[2부\]/)[0];
 }

 var cards=["","","","","",""];

 for(var n=1;n<=6;n++){
  var next=(n<6)
   ? "\\n\\s*"+(n+1)+"\\."
   : "$";

  var re=new RegExp(
   "(?:^|\\n)\\s*"+n+"\\.\\s*([\\s\\S]*?)(?="+next+")"
  );

  var m=first.match(re);

  if(m){
   cards[n-1]=String(m[1]||"")
    .replace(/\n\s*[-•]\s*/g," ")
    .replace(/\*\*/g,"")
    .replace(/\s+/g," ")
    .trim();
  }
 }

 var audit="";
 var idx=txt.indexOf("[2부]");
 if(idx>=0){
  audit=txt.slice(idx)
   .replace(/^\[2부\]\s*구성 확인표\s*/,"")
   .trim();
 }

 var found=cards.filter(function(x){return x.trim();}).length;

 if(found){
  S.cards=cards;
 }
 if(audit){
  S.audit=audit;
 }

 return found;
}

function cleanMdText(v){
 return String(v||"")
  .replace(/\\([*_~`])/g,"$1")
  .replace(/\*\*/g,"")
  .replace(/__/g,"")
  .replace(/`/g,"")
  .replace(/^\s*[-•]\s*/,"")
  .trim();
}

function headingText(line){
 return cleanMdText(
  String(line||"")
   .replace(/^\s*#{1,6}\s*/,"")
   .replace(/^\s*\[/,"")
   .replace(/\]\s*$/,"")
 ).trim();
}

function sectionByHeading(text,startRe,endRes){
 var lines=String(text||"").replace(/\r\n?/g,"\n").split("\n");
 var start=-1;
 var end=lines.length;

 for(var i=0;i<lines.length;i++){
  if(startRe.test(headingText(lines[i]))){
   start=i+1;
   break;
  }
 }

 if(start<0)return "";

 for(var j=start;j<lines.length;j++){
  var h=headingText(lines[j]);

  for(var e=0;e<endRes.length;e++){
   if(endRes[e].test(h)){
    end=j;
    return lines.slice(start,end).join("\n").trim();
   }
  }
 }

 return lines.slice(start,end).join("\n").trim();
}

function listItemsFromSection(section,max){
 var text=String(section||"").replace(/\r\n?/g,"\n");

 /* Notebook/Gemini 결과가 화면에서는 여러 줄로 보여도 복사할 때
    "1. ... 2. ... 3. ..." 또는 "- [ ] ... - [ ] ..."처럼 한 줄로
    합쳐지는 경우가 있어 목록 표식을 기준으로 먼저 줄을 복원합니다. */
 text=text
  .replace(/[ \t]+(?=(?:[1-9]\d*)[.)][ \t]+)/g,"\n")
  .replace(/[ \t]+(?=-[ \t]*\[[ xX]?\][ \t]+)/g,"\n")
  .replace(/[ \t]+(?=-[ \t]+(?=(?:\*\*|__|[가-힣A-Za-z])))/g,"\n");

 var lines=text.split("\n");
 var out=[];
 var cur="";

 function push(){
  var v=cleanMdText(cur)
   .replace(/^\[\s*[xX]?\s*\]\s*/,"")
   .trim();

  if(v && !/^없음$/i.test(v)){
   out.push(v);
  }
  cur="";
 }

 for(var i=0;i<lines.length;i++){
  var raw=lines[i];
  var line=raw.trim();

  if(!line || /^---+$/.test(line))continue;
  if(/^#{1,6}\s+/.test(line))continue;

  var numbered=line.match(/^\s*(\d+)[.)]\s+(.+)$/);
  var checkbox=line.match(/^\s*[-•]\s*\[\s*[xX]?\s*\]\s*(.+)$/);
  var bullet=line.match(/^\s*[-•]\s+(.+)$/);

  if(numbered || checkbox || bullet){
   if(cur)push();

   if(numbered)cur=numbered[2];
   else if(checkbox)cur=checkbox[1];
   else cur=bullet[1];

   if(out.length>=max)break;
   continue;
  }

  /* 목록 항목의 줄바꿈으로 이어진 설명은 같은 항목에 붙입니다. */
  if(cur){
   cur+=" "+line;
  }else{
   cur=line;
  }
 }

 if(cur && out.length<max)push();

 return out.slice(0,max);
}

function firstMeaningfulItem(section){
 var items=listItemsFromSection(section,3);
 if(items.length)return items[0];

 var lines=String(section||"").split(/\n+/);
 for(var i=0;i<lines.length;i++){
  var v=cleanMdText(lines[i]);
  if(v && !/^---+$/.test(v)){
   return v;
  }
 }
 return "";
}

function cleanLabeledBlock(section){
 var lines=String(section||"").replace(/\r\n?/g,"\n").split("\n");
 var out=[];

 for(var i=0;i<lines.length;i++){
  var v=cleanMdText(lines[i])
   .replace(/^\[\s*[xX]?\s*\]\s*/,"")
   .trim();

  if(!v || /^---+$/.test(v))continue;
  if(/^#{1,6}\s+/.test(lines[i].trim()))continue;
  out.push(v);
 }

 return out.join("\n").trim();
}

function parseHoldBlock(section){
 var text=cleanLabeledBlock(section);
 var result={item:"",reason:""};

 var item=text.match(/(?:정보|제외\s*후보|보류\s*후보)\s*:\s*([\s\S]*?)(?=\n\s*(?:이유|사유)\s*:|$)/i);
 var reason=text.match(/(?:이유|사유)\s*:\s*([\s\S]*)$/i);

 if(item)result.item=item[1].trim();
 if(reason)result.reason=reason[1].trim();

 if(!result.item || !result.reason){
  var items=listItemsFromSection(section,2);
  if(!result.item && items[0])result.item=items[0].replace(/^(?:정보|제외\s*후보|보류\s*후보)\s*:\s*/i,"").trim();
  if(!result.reason && items[1])result.reason=items[1].replace(/^(?:이유|사유)\s*:\s*/i,"").trim();
 }

 return result;
}

function parseQuestionBlock(section){
 var lines=String(section||"").replace(/\r\n?/g,"\n").split("\n");

 for(var i=0;i<lines.length;i++){
  var line=cleanMdText(lines[i]);
  if(!line || /^---+$/.test(line))continue;

  var q=line.match(/^(?:질문\s*:)?\s*(.+\?)\s*$/);
  if(q)return q[1].trim();
 }

 for(var j=0;j<lines.length;j++){
  var v=cleanMdText(lines[j]).replace(/^질문\s*:\s*/,"").trim();
  if(v && !/^---+$/.test(v) && !/^(?:🥣|📌|👉|원하시면|어르신이)/.test(v)){
   return v;
  }
 }

 return "";
}

function parseSelectResult(raw){

 if(!txt.trim())return 0;

 var coreSec=sectionByHeading(

 );

 var actionSec=sectionByHeading(
  txt,
  /체크\s*가능한\s*행동/i,
  [/도움받을\s*곳/i,/주의문장/i,/보류.*제외/i,/추가\s*확인\s*질문/i]
 );

 var helpSec=sectionByHeading(
  txt,
  /도움받을\s*곳.*확인할\s*내용/i,
  [/주의문장/i,/보류.*제외/i,/추가\s*확인\s*질문/i]
 );

 var cautionSec=sectionByHeading(
  txt,
  /주의문장/i,
  [/보류.*제외/i,/추가\s*확인\s*질문/i]
 );

 var holdSec=sectionByHeading(
  txt,
  /보류.*제외/i,
  [/추가\s*확인\s*질문/i]
 );

 var questionSec=sectionByHeading(
  txt,
  /추가\s*확인\s*질문/i,
  []
 );

 var core=listItemsFromSection(coreSec,3);
 var actions=listItemsFromSection(actionSec,3);
 var help=cleanLabeledBlock(helpSec);
 var caution=firstMeaningfulItem(cautionSec);
 var hold=parseHoldBlock(holdSec);
 var question=parseQuestionBlock(questionSec);

 if(core.length){
  for(var i=0;i<3;i++)S.core[i]=core[i]||"";
 }

 if(actions.length){
  for(var a=0;a<3;a++)S.actions[a]=actions[a]||"";
 }

 if(help)S.help=help;
 if(caution)S.caution=caution;
 if(hold.item)S.holdItem=hold.item;
 if(hold.reason)S.holdReason=hold.reason;
 if(question)S.question=question;

 var found=0;
 if(core.length===3)found++;
 if(actions.length>=2)found++;
 if(help)found++;
 if(caution)found++;
 if(S.holdItem && S.holdReason)found++;
 if(question)found++;

 parseSelectResult.lastCounts={
  core:core.length,
  actions:actions.length,
  help:help?1:0,
  caution:caution?1:0,
  hold:(S.holdItem && S.holdReason)?1:0,
  question:question?1:0
 };

 return found;
}

function claimBlock(){
 var a=[];
 var n=parseInt(S.claimCount,10)||0;

 for(var i=0;i<n;i++){
  var c=S.claims[i];

  if(!c.status){
   continue;
  }

  a.push(
   (i+1)+"번 주장 = "+statusLabel(c.status)+
   (c.note.trim()
    ? " / 메모: "+c.note
    : "")
  );
 }

 return a.length
  ? a.join("\n")
  : "(미판정)";
}

  r+='<div class="tick'+
  (i<step?' on':'')+
  (i===step?' now':'')+
  '"><b></b><span>'+(i+1)+'. '+TITLES[i]+'</span></div>';
 }

 $("rail").innerHTML=r;
 $("err").textContent="";
 $("prev").disabled=(step===0);
 $("next").textContent=(step===LAST?"처음 화면":"다음");

 var screens=[
  scr1,scr2,scr3,scr4,scr5,scr6,
  scr7,scr8,scr9,scr10,scr11,scr12
 ];

 $("panel").innerHTML=screens[step]();
 bind();
}

function scrollStepTop(){
 try{
  if(document.activeElement && document.activeElement.blur){
   document.activeElement.blur();
  }
 }catch(e){}

 function goTop(){
  try{
   window.scrollTo({top:0,left:0,behavior:"auto"});
  }catch(e){
   window.scrollTo(0,0);
  }

  var root=$("wz");
  if(root && root.scrollIntoView){
   root.scrollIntoView({behavior:"auto",block:"start"});
  }
 }

 goTop();
 requestAnimationFrame(goTop);
 setTimeout(goTop,60);
 setTimeout(goTop,180);
}

/* 입력 이벤트 */
function bind(){
 var p=$("panel");

 p.addEventListener("input",function(e){
  onInput(e);
  scheduleAutoSave();
 });
 p.addEventListener("change",function(e){
  onChange(e);
  scheduleAutoSave();
 });
 p.addEventListener("click",onClick);
}

function onInput(e){
 var t=e.target;
 var id=t.id;

 if(id==="condEtc")S.condEtc=t.value;
 else if(id==="condWhy")S.condWhy=t.value;
 else if(id==="targetEtc")S.targetEtc=t.value;

 else if(id==="topic")S.topic=t.value;
 else if(id==="purpose")S.purpose=t.value;
 else if(id==="aud")S.aud=t.value;
 else if(id==="region")S.region=t.value;

 else if(id==="sourceResearch"){
  S.sourceResearch=t.value;
  var sp=$("sourceParseStatus");
  if(sp){
   var n=parseSourceResearch(S.sourceResearch).length;
   sp.innerHTML=S.sourceResearch.trim()
    ? "자동 인식된 사용 후보: <strong>"+n+"건</strong>"
    : "ChatGPT 결과를 붙여넣으면 사용 가능한 공식자료를 자동으로 읽습니다.";
  }
 }

 else if(id==="verif"){
  S.verif=t.value;
  parseVerifyResult(S.verif);

function onClick(e){
 var pb=e.target.closest("[data-pool]");

 if(pb){
  var p=POOL[+pb.dataset.pool];
  var slot=-1;

  for(var i=0;i<3;i++){
   if(cleanUrl(S.src[i].u)===cleanUrl(p.u)){
    flash(pb,"이미 있음");
    return;
   }

   if(slot<0 && !S.src[i].o.trim() && !S.src[i].u.trim()){
    slot=i;
   }
  }

  if(slot<0){
   flash(pb,"자리 없음");
   return;
  }

  S.src[slot].o=p.o;
  S.src[slot].t=p.t;
  S.src[slot].u=cleanUrl(p.u);
  S.src[slot].use=true;

  S.sourceResearch="";
  if($("sourceResearch"))$("sourceResearch").value="";
  if($("sourceParseStatus"))$("sourceParseStatus").textContent="준비된 공식자료를 직접 선택했습니다.";

  flash(pb,"넣음");
  scheduleAutoSave();
  return;
 }

 var rb=e.target.closest("[data-roll]");

 if(rb){
  S.cond=String(Math.floor(Math.random()*COND.length));
  S.rolls++;
  $("panel").innerHTML=scr2();
  bind();
  scheduleAutoSave();
  return;
 }

 var b=e.target.closest("[data-copy]");

 if(!b){
  return;
 }

 var ta=b.closest(".prompt").querySelector("textarea");
 ta.focus();
 ta.select();

 var ok=false;

 try{
  ok=document.execCommand("copy");
 }catch(x){}

 if(!ok && navigator.clipboard){
  navigator.clipboard.writeText(ta.value).then(
   function(){flash(b,"복사됨");},
   function(){flash(b,"직접 복사");}
  );
 }else{
  flash(b,ok ? "복사됨" : "직접 복사");
 }
}

function flash(b,msg){
 var old=b.textContent;
 b.textContent=msg;

 setTimeout(function(){
  b.textContent=old;
 },1200);
}

/* 단계 검증 */
function valid(){

 if(step===0){
  return S.basket ? "" : "바구니를 하나 고르세요.";
 }

 if(step===1){
  if(S.cond===""){
   return "상황조건을 배정받으세요.";
  }

  if(S.cond==="etc" && (!S.condEtc.trim() || !S.condWhy.trim())){
   return "기타 상황조건과 이유를 모두 적으세요.";
  }

  if(!S.target){
   return "대상유형을 고르세요.";
  }

  if(S.target==="etc" && !S.targetEtc.trim()){
   return "기타 대상유형을 적으세요.";
  }

  return "";
 }

 if(step===2){
  if(!S.topic.trim() || !S.purpose.trim() || !S.aud.trim()){
   return "주제·목적·대상과 상황을 모두 채우세요.";
  }

  if(!S.topicChecks.every(Boolean)){
   return "확인 세 줄을 모두 체크하세요.";
  }

  return "";
 }

 if(step===3){
  if(!S.searchDone){
   return "ChatGPT 검색 결과를 확인했거나 준비된 자료를 사용한다는 확인란을 체크하세요.";
  }

  if(S.sourceResearch.trim()){
   applyParsedSources();
  }

  return "";
 }

 if(step===4){
  var n=0;

  for(var i=0;i<3;i++){
   var r=S.src[i];

   if(!r.use){
    continue;
   }

   r.u=cleanUrl(r.u);

   if(!r.o.trim() || !r.t.trim() || !/^https?:\/\//.test(r.u.trim())){
    return "사용할 공식자료 "+(i+1)+"의 기관명·제목·정상 URL을 확인하세요.";
   }

   for(var c=0;c<4;c++){
    if(!r.checks[c]){
     return "사용할 공식자료 "+(i+1)+"의 책임기관·질문 적합성·원문·제목 확인을 먼저 완료하세요.";
    }
   }

   n++;
  }

  if(n<2){
   return "원문 확인을 통과한 공식자료가 최소 2건 필요합니다.";
  }

  if(!S.notebookAdded){
   return "확정한 공식자료를 Gemini Notebook에 추가한 뒤 체크하세요.";
  }

  for(var j=0;j<3;j++){
   var rr=S.src[j];

   if(!rr.use){
    continue;
   }

   if(!rr.checks[4]){
    return "사용할 공식자료 "+(j+1)+"이 Gemini Notebook에서 실제 본문까지 보이는지 확인하세요.";
   }
  }

  return "";
 }

 if(step===5){
  if(!S.verif.trim()){
   return "Gemini Notebook 결과를 붙여넣으세요.";
  }

  if(S.claimCount===""){
   parseVerifyResult(S.verif);
  }

  if(S.claimCount===""){
   return "Gemini 결과에서 '검증 가능한 주장 수'를 자동으로 읽지 못했습니다. 프롬프트 형식대로 출력했는지 확인하세요.";
  }

  var count=parseInt(S.claimCount,10);

  if(count===0){
   return "현재 자료에서는 검증 가능한 생활안내 주장을 찾지 못했습니다. 이전 단계로 돌아가 출처를 다시 선택하세요.";
  }

  for(var k=0;k<count;k++){
   if(!claimDetailsComplete(S.claimDetails[k])){
    return "주장 "+(k+1)+"의 기관·문서·날짜·위치·원문 근거·범위 중 자동 인식되지 않은 칸이 있습니다. Gemini 결과를 다시 확인하거나 같은 프롬프트로 다시 출력해 주세요.";
   }

   if(!S.claims[k].status){
    return "주장 "+(k+1)+"의 판정을 선택하세요.";
   }
  }

  if(!S.sixConfirmed){
   return "근거 확인 6칸을 원문에서 확인했다는 체크를 완료하세요.";
  }

  var usable=0;

  for(var u=0;u<count;u++){
   if(S.claims[u].status==="use" || S.claims[u].status==="conditional"){
    usable++;
   }
  }

  if(usable<2){
   return "7차시 안내자료를 만들려면 확인 또는 조건부로 사용할 수 있는 생활안내 주장이 최소 2개 필요합니다. 출처를 다시 확인하세요.";
  }

  return "";
 }

 if(step===6){
  for(var q=0;q<6;q++){
   if(!S.cards[q].trim()){
    return "정보카드 6장을 모두 확인하세요.";
   }
  }

  if(S.cards[5].indexOf("?")<0){
   return "카드6에는 추가 확인 질문이 포함되어야 합니다.";
  }

  if(!S.audit.trim()){
   return "구성 확인표를 확인하세요.";
  }

  for(var x=0;x<3;x++){
   if(!S.core[x].trim()){
    return "핵심정보 3개를 모두 선택하세요.";
   }
  }

  if(!S.actions[0].trim() || !S.actions[1].trim()){
   return "체크 가능한 행동을 최소 2개 적으세요.";
  }

  if(!S.help.trim() || !S.caution.trim() || !S.question.trim()){
   return "도움·주의·추가질문을 채우세요.";
  }

  if(!S.holdItem.trim() || !S.holdReason.trim()){
   return "보류 또는 제외한 정보 1개와 이유를 적으세요.";
  }

  return "";
 }

 if(step===7){
  if(!S.finalTitle.trim() || !S.finalAud.trim()){
   return "행동형 제목과 누구·언제를 직접 작성하세요.";
  }

  for(var y=0;y<3;y++){
   if(!S.finalCore[y].trim()){
    return "이전 문장을 참고해 핵심정보 3개를 쉬운 문장으로 직접 다시 써보세요.";
   }
  }

  if(!S.finalActions[0].trim() || !S.finalActions[1].trim()){
   return "이전 행동을 참고해 오늘 해볼 일을 최소 2개 직접 다시 써보세요.";
  }

  if(!S.finalHelp.trim() || !S.finalCaution.trim()){
   return "도움받을 곳과 주의 문장을 직접 다시 써보세요.";
  }

  if(!S.onePageFreeze){
   return "내가 다시 쓴 한 장 5칸을 정본으로 확정하세요.";
  }

  return "";
 }

 if(step===8){
  if(!S.infographicLocation.trim()){
   return "인포그래픽 또는 대체본의 위치를 기록하세요.";
  }

  if(!S.infographicChecks.every(Boolean)){
   return "5가지 검수를 모두 확인하세요.";
  }

  if(!S.keyMessage.trim()){
   return "이 한 장에서 가장 중요한 메시지 1개를 적으세요.";
  }

  if(!S.masterLocked){
   return "검수한 한 장을 다음 콘텐츠 제작의 원본으로 잠그세요.";
  }

  return "";
 }

 if(step===9){
  if(!S.useScene.trim()){
   return "이 콘텐츠를 실제로 볼·들을 장면을 적으세요.";
  }

  if(!S.contentType){
   return "콘텐츠 1종을 고르세요.";
  }

  if(S.contentType==="other" && !S.contentOther.trim()){
   return "기타 콘텐츠 종류를 적으세요.";
  }

  if(!S.contentLock){
   return "원본 잠금을 체크하세요.";
  }

  S.choiceReason=autoChoiceReason();
  return "";
 }

 if(step===10){
  if(!S.resultLocation.trim()){
   return "완성 결과 위치 또는 생성 상태를 기록하세요.";
  }

  if(!S.shareChecks.every(Boolean)){
   return "공유 전 다섯 문을 모두 확인하세요.";
  }

  return "";
 }

 if(step===11){
  if(!S.finalChecks.every(Boolean)){
   return "최종 다섯 기준을 모두 확인하세요.";
  }

  if(S.presentationCore==="" || S.presentationAction===""){
   return "30·60·30 발표에 사용할 핵심정보와 행동을 선택하세요.";
  }

  if(!S.revisionCriterion || !S.revisionPlan.trim()){
   return "가장 먼저 고칠 기준 하나와 수정 내용 또는 계획을 적으세요.";
  }

  if(!S.firstUsePlan.trim()){
   return "7일 안의 첫 사용 계획을 적으세요.";
  }

  if(!S.shareIntent){
   return "공유 의향을 선택하세요.";
  }

  return "";
 }

 return "";
}

/* GitHub Pages 저장 방식: 자동저장 + 이어하기 + JSON 백업 */
function storageGet(){
 try{
  return localStorage.getItem(STORAGE_KEY);
 }catch(e){
  storageAvailable=false;
  return null;
 }
}

function storageSet(value){
 try{
  localStorage.setItem(STORAGE_KEY,value);
  storageAvailable=true;
  return true;
 }catch(e){
  storageAvailable=false;
  return false;
 }
}

function storageRemove(){
 try{
  localStorage.removeItem(STORAGE_KEY);
  return true;
 }catch(e){
  storageAvailable=false;
  return false;
 }
}

function nowIso(){
 return new Date().toISOString();
}

function formatSavedTime(iso){
 if(!iso)return "시간 정보 없음";

 try{
  return new Intl.DateTimeFormat("ko-KR",{
   month:"numeric",
   day:"numeric",
   hour:"2-digit",
   minute:"2-digit",
   hour12:false
  }).format(new Date(iso));
 }catch(e){
  return iso;
 }
}

function currentStepLabel(n){
 var idx=Math.max(0,Math.min(LAST,Number(n)||0));
 return (idx+1)+". "+TITLES[idx];
}

function makeSavePayload(){
 return {
  backupType:"AI_CITIZEN_SMART_AGING_WIZARD",
  wizardVersion:WIZARD_VERSION,
  savedAt:nowIso(),
  currentStep:step,
  topic:S.topic||"",
  state:S
 };
}

function updatePersistStatus(savedAt,msg){
 var el=$("persistStatus");
 if(!el)return;

 if(msg){
  el.innerHTML="<strong>"+esc(msg)+"</strong>";
  return;
 }

 if(!storageAvailable){
  el.innerHTML="<strong>자동 저장을 사용할 수 없습니다.</strong> 백업 파일을 이용하세요.";
  return;
 }

 if(savedAt){
  el.innerHTML="<strong>✓ 자동 저장됨 · "+esc(formatSavedTime(savedAt))+"</strong> · 현재 위치: "+esc(currentStepLabel(step));
 }else{
  el.innerHTML="<strong>자동 저장 사용 중</strong> · 현재 위치: "+esc(currentStepLabel(step));
 }
}

function autoSaveNow(){
 if(!storageAvailable){
  updatePersistStatus("");
  return false;
 }

 var payload=makeSavePayload();
 var ok=storageSet(JSON.stringify(payload));

 if(ok){
  updatePersistStatus(payload.savedAt);
 }

 return ok;
}

function scheduleAutoSave(){
 if(saveTimer){
  clearTimeout(saveTimer);
 }

 saveTimer=setTimeout(function(){
  saveTimer=null;
  autoSaveNow();
 },300);
}

function readSavedPayload(){
 var raw=storageGet();
 if(!raw)return null;

 try{
  var p=JSON.parse(raw);

  if(p && p.state && typeof p.state==="object"){
   return p;
  }
 }catch(e){}

 return null;
}

function applySavedPayload(payload){
 if(!payload || !payload.state){
  return false;
 }

 S=JSON.parse(JSON.stringify(INITIAL_STATE));
 normalize(payload.state,payload.wizardVersion);

 var savedStep=parseInt(payload.currentStep,10);
 step=isNaN(savedStep) ? 0 : Math.max(0,Math.min(LAST,savedStep));

 render();
 scrollStepTop();
 autoSaveNow();
 return true;
}

function showResumePrompt(payload){
 var overlay=$("resumeOverlay");
 var meta=$("resumeMeta");

 if(!overlay || !meta){
  applySavedPayload(payload);
  return;
 }

 var title=(payload.topic || (payload.state && payload.state.topic) || "주제 미확정");
 var savedStep=parseInt(payload.currentStep,10);
 if(isNaN(savedStep))savedStep=0;

 meta.innerHTML=
  "<b>주제</b> "+esc(title)+"<br>"+
  "<b>마지막 작업</b> "+esc(currentStepLabel(savedStep))+"<br>"+
  "<b>마지막 저장</b> "+esc(formatSavedTime(payload.savedAt));

 overlay.classList.add("show");
 overlay.setAttribute("aria-hidden","false");

 $("resumeWork").onclick=function(){
  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden","true");
  applySavedPayload(payload);
 };

 $("resumeNew").onclick=function(){
  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden","true");
  clearAndStartFresh();
 };
}

function clearAndStartFresh(){
 if(saveTimer){
  clearTimeout(saveTimer);
  saveTimer=null;
 }

 storageRemove();
 S=JSON.parse(JSON.stringify(INITIAL_STATE));
 step=0;
 newWorkArmed=false;

 render();
 updatePersistStatus("", "새 작업을 시작했습니다");
 $("err").textContent="";
}

function resetNewWorkButton(){
 newWorkArmed=false;

 if(newWorkTimer){
  clearTimeout(newWorkTimer);
  newWorkTimer=null;
 }

 var b=$("newWork");

 if(b){
  b.textContent="처음부터 시작하기";
  b.classList.add("mini");
 }
}

function startNewWork(){
 var b=$("newWork");

 if(!newWorkArmed){
  newWorkArmed=true;

  if(b){
   b.textContent="정말 처음부터 시작";
  }

  updatePersistStatus("", "한 번 더 누르면 자동 저장된 현재 작업을 지우고 처음부터 시작합니다");

  if(newWorkTimer){
   clearTimeout(newWorkTimer);
  }

  newWorkTimer=setTimeout(function(){
   resetNewWorkButton();
   updatePersistStatus("");
  },6000);

  return;
 }

 if(newWorkTimer){
  clearTimeout(newWorkTimer);
  newWorkTimer=null;
 }

 clearAndStartFresh();
}

function safeFilePart(s){
 return String(s||"")
  .replace(/[\\/:*?"<>|]/g,"_")
  .replace(/\s+/g,"_")
  .slice(0,40);
}

function backupFileName(){
 var d=new Date();
 var pad=function(n){return String(n).padStart(2,"0");};
 var stamp=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"_"+pad(d.getHours())+pad(d.getMinutes());
 var topic=safeFilePart(S.topic);
 return "스마트에이징_작업백업_"+(topic ? topic+"_" : "")+stamp+".json";
}

function downloadBackup(){
 var payload=makeSavePayload();

 var blob=new Blob(
  [JSON.stringify(payload,null,2)],
  {type:"application/json;charset=utf-8"}
 );

 var url=URL.createObjectURL(blob);
 var a=document.createElement("a");
 a.href=url;
 a.download=backupFileName();
 document.body.appendChild(a);
 a.click();
 a.remove();

 setTimeout(function(){
  URL.revokeObjectURL(url);
 },1000);

 autoSaveNow();
 updatePersistStatus("", "백업 파일을 저장했습니다 · "+currentStepLabel(step));
}

function loadBackupFile(file){
 if(!file)return;

 var reader=new FileReader();

 reader.onload=function(){
  try{
   var p=JSON.parse(String(reader.result||""));
   var payload;

   if(p && p.state && typeof p.state==="object"){
    payload=p;
   }else if(p && typeof p==="object"){
    payload={
     backupType:"LEGACY",
     wizardVersion:"legacy",
     savedAt:"",
     currentStep:0,
     topic:p.topic||"",
     state:p
    };
   }else{
    throw new Error("invalid");
   }

   if(
    payload.backupType &&
    payload.backupType!=="AI_CITIZEN_SMART_AGING_WIZARD" &&
    payload.backupType!=="LEGACY"
   ){
    throw new Error("wrong backup type");
   }

   applySavedPayload(payload);
   $("err").textContent="백업 파일을 불러왔습니다. 저장했던 단계에서 계속 진행하세요.";
  }catch(e){
   $("err").textContent="백업 파일을 읽지 못했습니다. 이 위저드에서 저장한 JSON 파일인지 확인하세요.";
  }finally{
   if($("backupFile"))$("backupFile").value="";
  }
 };

 reader.onerror=function(){
  $("err").textContent="백업 파일을 읽는 중 오류가 발생했습니다.";
  if($("backupFile"))$("backupFile").value="";
 };

 reader.readAsText(file,"utf-8");
}

function bindPersistenceControls(){
 if($("backupSave")){
  $("backupSave").onclick=function(){
   resetNewWorkButton();
   downloadBackup();
  };
 }

 if($("backupLoad")){
  $("backupLoad").onclick=function(){
   resetNewWorkButton();
   if($("backupFile"))$("backupFile").click();
  };
 }

 if($("backupFile")){
  $("backupFile").onchange=function(e){
   var f=e.target.files && e.target.files[0];
   if(f)loadBackupFile(f);
  };
 }

 if($("newWork")){
  $("newWork").onclick=startNewWork;
 }
}

/* 구버전 백업 데이터 호환 */
function normalize(o,fromVersion){

 if(!o || typeof o!=="object"){
  return;
 }

 for(var k in S){
  if(o[k]!==undefined){
   S[k]=o[k];
  }
 }

 if(!Array.isArray(S.src)){
  S.src=[];
 }

 for(var i=0;i<3;i++){

  if(Array.isArray(S.src[i])){
   var old=S.src[i];
   var n=blankSource();

   n.o=old[0]||"";
   n.t=old[1]||"";
   n.u=cleanUrl(old[2]||"");

   S.src[i]=n;
  }

  if(!S.src[i]){
   S.src[i]=blankSource();
  }

  S.src[i].u=cleanUrl(S.src[i].u||"");
  if(S.src[i].use===undefined){
   S.src[i].use=!!((S.src[i].o||S.src[i].t||S.src[i].u) && i<2);
  }else{
   S.src[i].use=!!S.src[i].use;
  }

  if(!Array.isArray(S.src[i].checks)){
   S.src[i].checks=[];
  }

  while(S.src[i].checks.length<5){
   S.src[i].checks.push(false);
  }

  S.src[i].checks=S.src[i].checks.slice(0,5);
 }

 if(!Array.isArray(S.claims)){
  S.claims=[];
 }

 for(var j=0;j<4;j++){
  if(!S.claims[j]){
   S.claims[j]=blankClaim();
  }else{
   S.claims[j]={
    status:S.claims[j].status||"",
    note:S.claims[j].note||""
   };
  }
 }

 if(!Array.isArray(S.claimDetails)){
  S.claimDetails=[];
 }

 for(var d=0;d<4;d++){
  var oldd=S.claimDetails[d]||{};
  S.claimDetails[d]={
   statement:oldd.statement||"",
   institution:oldd.institution||"",
   document:oldd.document||"",
   date:oldd.date||"",
   location:oldd.location||"",
   evidence:oldd.evidence||"",
   scope:oldd.scope||"",
   scopeTarget:oldd.scopeTarget||"",
   scopeCondition:oldd.scopeCondition||"",
   scopeOther:oldd.scopeOther||"",
   application:oldd.application||""
  };
 }

 if(S.claimCount===undefined || S.claimCount===null){
  S.claimCount="";
 }
 S.claimCount=String(S.claimCount);

 if(!Array.isArray(S.cards)){
  S.cards=["","","","","",""];
 }

 while(S.cards.length<6){
  S.cards.push("");
 }

 if(!Array.isArray(S.core)){
  S.core=["","",""];
 }

 while(S.core.length<3){
  S.core.push("");
 }

 if(!Array.isArray(S.actions)){
  S.actions=["","",""];
 }

 while(S.actions.length<3){
  S.actions.push("");
 }

 /* 8차시 직접 재작성 필드 */
 if(!Array.isArray(S.finalCore)){
  S.finalCore=["","",""];
 }
 while(S.finalCore.length<3){
  S.finalCore.push("");
 }

 if(!Array.isArray(S.finalActions)){
  S.finalActions=["","",""];
 }
 while(S.finalActions.length<3){
  S.finalActions.push("");
 }

 if(!S.finalHelp)S.finalHelp="";
 if(!S.finalCaution)S.finalCaution="";

 /* v0.9 이하에서 이어오는 작업은 8차시 직접 재작성 활동이 없었던 버전입니다.
    1~7차시 작업은 유지하되 8차시 정본만 비워 학습자가 새 활동을 직접 수행합니다. */
 var fv=String(fromVersion||"");
 var oldStep8=(fv==="legacy" || fv==="v0.8" || fv==="v0.9" || fv==="");

 if(oldStep8){
  S.finalTitle="";
  S.finalAud="";
  S.finalPurpose="";
  S.finalCore=["","",""];
  S.finalActions=["","",""];
  S.finalHelp="";
  S.finalCaution="";
  S.onePageFreeze=false;
 }

 if(fv==="v0.10"){
  var sameCore=S.finalCore.join("\n")===S.core.slice(0,3).join("\n");
  var sameActions=S.finalActions.join("\n")===S.actions.slice(0,3).join("\n");
  var sameHelp=(S.finalHelp||"")===(S.help||"");
  var sameCaution=(S.finalCaution||"")===(S.caution||"");

  if(!String(S.finalTitle||"").trim() && sameCore && sameActions && sameHelp && sameCaution){
   S.finalAud="";
   S.finalPurpose="";
   S.finalCore=["","",""];
   S.finalActions=["","",""];
   S.finalHelp="";
   S.finalCaution="";
   S.onePageFreeze=false;
  }
 }

 [
  ["topicChecks",3],
  ["infographicChecks",5],
  ["shareChecks",5],
  ["finalChecks",5]
 ].forEach(function(pair){
  var key=pair[0],len=pair[1];

  if(!Array.isArray(S[key])){
   S[key]=[];
  }

  while(S[key].length<len){
   S[key].push(false);
  }

  S[key]=S[key].slice(0,len);
 });

 if(!S.revisionPlan && S.revisionAfter){
  S.revisionPlan=S.revisionAfter;
 }

 if(!S.revisionCriterion && S.revisionReason){
  S.revisionCriterion=S.revisionReason;
 }

 if(!S.firstUsePlan){
  var oldPlan=[
   S.firstUseWho,
   S.firstUseWhenWhere,
   S.firstUseHow,
   S.firstUseCheck
  ].filter(function(x){return x && String(x).trim();});

  if(oldPlan.length){
   S.firstUsePlan=oldPlan.join(" / ");
  }
 }

 if(S.presentationCore===undefined || S.presentationCore===null){
  S.presentationCore="0";
 }
 if(S.presentationAction===undefined || S.presentationAction===null){
  S.presentationAction="0";
 }

 S.presentationCore=String(S.presentationCore);
 S.presentationAction=String(S.presentationAction);

 if(!S.cardResult)S.cardResult="";
 if(!S.revisionCriterion)S.revisionCriterion="";
 if(!S.revisionPlan)S.revisionPlan="";
 if(!S.firstUsePlan)S.firstUsePlan="";
 if(!S.shareIntent)S.shareIntent="";

 /* v0.11에서 저장된 작업 중 06 evidence 필드가 normalize 과정에서 유실된 경우
    원래 Gemini 붙여넣기 결과에서 다시 복구합니다. */
 if(String(S.verif||"").trim()){
  var needVerifyRepair=false;
  var cc=parseInt(S.claimCount||"0",10);

  for(var vr=0;vr<cc;vr++){
   if(!String((S.claimDetails[vr]||{}).evidence||"").trim()){
    needVerifyRepair=true;
    break;
   }
  }

  if(needVerifyRepair){
   var oldClaims=S.claims.slice();
   parseVerifyResult(S.verif);

   for(var vc=0;vc<4;vc++){
    if(oldClaims[vc]){
     S.claims[vc]=oldClaims[vc];
    }
   }
  }
 }

 /* v0.10~v0.11의 07 결과가 실제 Gemini 제목 변형 때문에 잘못 들어간 경우
    원래 붙여넣은 결과를 새 파서로 다시 읽어 자동 복구합니다. */
 if(
  (String(fromVersion||"")==="v0.10" || String(fromVersion||"")==="v0.11") &&
  String(S.selectResult||"").trim()
 ){
  parseSelectResult(S.selectResult);
 }
}

function initPersistence(){
 bindPersistenceControls();

 var saved=readSavedPayload();

 render();

 if(saved){
  updatePersistStatus(saved.savedAt);
  showResumePrompt(saved);
 }else{
  autoSaveNow();
 }
}

initPersistence();

})();
</script>
